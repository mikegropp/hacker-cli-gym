name: release image

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  checks: read
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require green tests for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          for required_check in linux-gym powershell-gym; do
            successful=$(jq --arg name "$required_check" \
              '[.check_runs[] | select(.name == $name and .conclusion == "success")] | length' \
              <<< "$check_runs")
            if [ "$successful" -lt 1 ]; then
              echo "::error::A successful $required_check check is required for commit $GITHUB_SHA."
              exit 1
            fi
          done

      - name: Calculate launcher-compatible source fingerprint
        id: source
        shell: bash
        run: |
          manifest=''
          while IFS= read -r file; do
            digest=$(sha256sum "$file" | awk '{print $1}')
            manifest+="$file $digest"$'\n'
          done < <(printf '%s\n' Dockerfile container/gym curriculum/linux.json; find sample-files -type f -print | LC_ALL=C sort)
          fingerprint=$(printf '%s' "$manifest" | sha256sum | awk '{print $1}')
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/hacker-cli-gym
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GYM_SOURCE_HASH=${{ steps.source.outputs.fingerprint }}
            GYM_BUILD_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
