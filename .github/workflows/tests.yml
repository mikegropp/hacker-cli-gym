name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gym:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check Bash syntax
        run: bash -n gym container/gym

      - name: Analyze Bash launchers
        run: |
          docker run --rm --volume "$PWD:/mnt:ro" \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            /mnt/gym /mnt/container/gym

      - name: Analyze Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Regenerate curricula
        run: |
          node tools/generate-linux-curriculum.mjs
          node tools/generate-powershell-curriculum.mjs
          node tools/validate-curricula.mjs
          git diff --exit-code -- curriculum/linux.json curriculum/powershell.json

      - name: Detect Linux runtime changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n $BASE_SHA && ! $BASE_SHA =~ ^0+$ ]] && \
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && \
             git diff --quiet "$BASE_SHA" HEAD -- \
               .dockerignore Dockerfile compose.yaml gym container \
               curriculum/linux.base.json curriculum/linux.json curriculum/schema.json \
               sample-files tools; then
            echo 'full=false' >> "$GITHUB_OUTPUT"
            echo 'Linux runtime and curriculum are unchanged; skipping the full reference sweep.'
          else
            echo 'full=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build the Linux gym
        if: steps.changes.outputs.full == 'true'
        run: docker build --tag hacker-cli-gym:test .

      - name: Run all 500 Linux reference approaches
        if: steps.changes.outputs.full == 'true'
        run: |
          docker volume create hacker-cli-gym-ci-progress
          docker run --rm --init --network none --read-only \
            --tmpfs /work:rw,exec,nosuid,nodev,size=256m,mode=1777 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /run:rw,nosuid,nodev,size=32m,mode=0755 \
            --tmpfs /var/tmp:rw,exec,nosuid,nodev,size=32m,mode=1777 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --cap-add AUDIT_WRITE --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add FSETID \
            --cap-add NET_RAW --cap-add SETGID --cap-add SETUID --cap-add SYS_CHROOT \
            --pids-limit 512 --memory 768m --cpus 2.0 \
            --volume hacker-cli-gym-ci-progress:/var/lib/hacker-cli-gym \
            hacker-cli-gym:test test
          docker volume rm hacker-cli-gym-ci-progress

      - name: Exercise Linux progress recovery
        if: steps.changes.outputs.full == 'true'
        run: |
          docker volume create hacker-cli-gym-ci-recovery
          docker run --rm --volume hacker-cli-gym-ci-recovery:/state \
            --entrypoint bash hacker-cli-gym:test -c "printf '{broken' > /state/progress.json"
          docker run --rm --network none --volume hacker-cli-gym-ci-recovery:/var/lib/hacker-cli-gym \
            hacker-cli-gym:test status
          docker run --rm --volume hacker-cli-gym-ci-recovery:/state \
            --entrypoint bash hacker-cli-gym:test -c "set -e; test -f /state/progress.json; compgen -G '/state/progress.corrupt.*.json' >/dev/null; rm -f /state/progress.json; mkdir /state/progress.json"
          docker run --rm --network none --volume hacker-cli-gym-ci-recovery:/var/lib/hacker-cli-gym \
            hacker-cli-gym:test status
          docker run --rm --volume hacker-cli-gym-ci-recovery:/state \
            --entrypoint bash hacker-cli-gym:test -c "set -e; test -f /state/progress.json; compgen -G '/state/progress.corrupt-special.*.json' >/dev/null; rm -f /state/progress.json; mkfifo /state/progress.json"
          docker run --rm --network none --volume hacker-cli-gym-ci-recovery:/var/lib/hacker-cli-gym \
            hacker-cli-gym:test status
          docker run --rm --volume hacker-cli-gym-ci-recovery:/state \
            --entrypoint bash hacker-cli-gym:test -c "set -e; test -f /state/progress.json; compgen -G '/state/progress.corrupt-special.*.json' >/dev/null"
          docker volume rm hacker-cli-gym-ci-recovery

      - name: Exercise launcher diagnostics and syntax
        if: steps.changes.outputs.full == 'true'
        run: |
          ./gym version
          bash -n gym container/gym

      - name: Report image size
        if: steps.changes.outputs.full == 'true'
        run: |
          docker image inspect hacker-cli-gym:test --format 'Image size: {{.Size}} bytes'

  powershell-gym:
    runs-on: windows-2022
    env:
      HACKER_CLI_GYM_STATE_ROOT: ${{ github.workspace }}\hacker-cli-gym-ci-state
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Regenerate the PowerShell curriculum
        run: |
          node tools/generate-powershell-curriculum.mjs
          node tools/generate-linux-curriculum.mjs
          node tools/validate-curricula.mjs
          git diff --exit-code -- curriculum/linux.json curriculum/powershell.json

      - name: Detect PowerShell runtime changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:BASE_SHA) -or $env:BASE_SHA -match '^0+$') {
            'full=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          git cat-file -e "$($env:BASE_SHA)^{commit}" 2>$null
          if($LASTEXITCODE -ne 0) {
            'full=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          git diff --quiet $env:BASE_SHA HEAD -- gym.ps1 curriculum/powershell.base.json curriculum/powershell.json curriculum/schema.json tools
          if($LASTEXITCODE -eq 0) {
            'full=false' >> $env:GITHUB_OUTPUT
            Write-Host 'PowerShell runtime and curriculum are unchanged; skipping the full reference sweep.'
          } else {
            'full=true' >> $env:GITHUB_OUTPUT
          }

      - name: Exercise PowerShell progress recovery
        if: steps.changes.outputs.full == 'true'
        run: |
          New-Item -ItemType Directory -Path $env:HACKER_CLI_GYM_STATE_ROOT -Force | Out-Null
          $progress = Join-Path $env:HACKER_CLI_GYM_STATE_ROOT 'powershell-progress.json'
          [IO.File]::WriteAllText($progress, '{broken', [Text.Encoding]::UTF8)
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\gym.ps1 status
          if(-not (Get-ChildItem $env:HACKER_CLI_GYM_STATE_ROOT -Filter 'powershell-progress.corrupt-*.json')) { throw 'Corrupt progress was not preserved.' }
          Remove-Item $progress -Force
          New-Item -ItemType Directory -Path $progress | Out-Null
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\gym.ps1 status
          if(-not (Test-Path $progress -PathType Leaf)) { throw 'A directory at the progress path was not recovered.' }
          if(-not (Get-ChildItem $env:HACKER_CLI_GYM_STATE_ROOT -Filter 'powershell-progress.corrupt-special-*')) { throw 'Unsafe progress entry was not preserved.' }

      - name: Run all 500 PowerShell reference approaches
        if: steps.changes.outputs.full == 'true'
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\gym.ps1 test

      - name: Check PowerShell parser compatibility
        run: |
          foreach($path in '.\gym.ps1', '.\windows-sandbox.ps1') {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if($errors.Count){ $errors | Format-List; exit 1 }
          }

      - name: Analyze PowerShell runner
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $results = foreach($path in '.\gym.ps1', '.\windows-sandbox.ps1') {
            Invoke-ScriptAnalyzer -Path $path -Severity Error
          }
          if($results){ $results | Format-Table; exit 1 }
