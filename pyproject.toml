[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hacker-cli-gym"
version = "0.2.0"
description = "A free, local-first gym for Linux commands and Windows PowerShell."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Primer Security"}
]
keywords = ["cli", "linux", "bash", "windows", "powershell", "education", "terminal", "gamification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education"
]
dependencies = []

[project.scripts]
hacker-cli-gym = "hacker_cli_gym.cli:main"

[tool.setuptools.package-data]
hacker_cli_gym = ["lessons/schema.json", "lessons/*/*.json"]
